
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moral-memory-eval"
version = "0.1.0"
description = "Evaluating the effects of user moral reputation on LLM factual judgment and confidence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10,<3",
    "openai>=2.54,<3",
    "google-genai>=1.75,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

analysis = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "scipy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/llmkit", "experiments", "examples"]
